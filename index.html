<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102C28">

    <title>Harshita & Shishir | Wedding Invitation</title>

    <meta name="description" content="A royal wedding invitation for Harshita and Shishir.">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <main id="app">

        <section class="welcome-screen">

            <div class="ambient-glow"></div>

            <div class="particles" id="particles"></div>

            <div class="welcome-content">

                <p class="eyebrow">A SPECIAL INVITATION</p>

                <h1 class="welcome-heading">
                    A Royal Invitation
                    <span>Awaits You</span>
                </h1>

                <p class="welcome-subtitle">
                    A celebration of love, togetherness and forever.
                </p>

                <div class="envelope-container" id="envelope">

                    <div class="envelope">

                        <div class="envelope-back"></div>

                        <div class="envelope-letter">
                            <span>Harshita</span>
                            <span class="letter-heart">♥</span>
                            <span>Shishir</span>
                        </div>

                        <div class="envelope-front"></div>

                        <div class="envelope-flap"></div>

                        <button
                            class="wax-seal"
                            id="openInvitation"
                            aria-label="Open wedding invitation"
                        >
                            <span>H</span>
                            <span class="seal-heart">♥</span>
                            <span>S</span>
                        </button>

                    </div>

                </div>

                <button class="open-text" id="openText">
                    <span class="tap-icon">✧</span>
                    TAP TO OPEN
                    <span class="tap-icon">✧</span>
                </button>

                <p class="welcome-footer">
                    WITH LOVE & BLESSINGS
                </p>

            </div>

        </section>

    </main>

    <script src="main.js"></script>

</body>
</html>
